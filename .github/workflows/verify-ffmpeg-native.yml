name: Verify FFmpeg native and WASM

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            native: ${{ steps.filter.outputs.native || 'true' }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: dorny/paths-filter@v4
              id: filter
              if: github.event_name != 'workflow_dispatch'
              with:
                  base: ${{ github.event_name == 'push' && github.ref || '' }}
                  filters: |
                      native:
                        - '.github/workflows/verify-ffmpeg-native.yml'
                        - 'package.json'
                        - 'ffmpeg/.dockerignore'
                        - 'ffmpeg/Dockerfile'
                        - 'ffmpeg/build-config.json'
                        - 'ffmpeg/native/**'
                        - 'ffmpeg/package.json'
                        - 'ffmpeg/scripts/generate-*.mjs'
                        - 'ffmpeg/scripts/lib.mjs'
                        - 'ffmpeg/scripts/prepare-sources.mjs'
                        - 'ffmpeg/scripts/test-native.sh'
                        - 'ffmpeg/tests/native/**'
                        - 'ffmpeg/tests/wasm/**'

    native-tests:
        name: native-tests
        needs: changes
        if: needs.changes.outputs.native == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm install --global yarn
            - run: yarn set version 3.2.0
            - run: yarn install --immutable
            - run: yarn verify:ffmpeg:native

    native-gate:
        name: native-gate
        needs: [changes, native-tests]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check native verification result
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
                  NATIVE_TEST_RESULT: ${{ needs.native-tests.result }}
              run: |
                  if [[ "$CHANGES_RESULT" != "success" ]]; then
                      echo "Failed to determine whether native FFmpeg tests are required" >&2
                      exit 1
                  fi

                  if [[ "$NATIVE_REQUIRED" == "true" && "$NATIVE_TEST_RESULT" != "success" ]]; then
                      echo "Native FFmpeg tests were required but did not pass" >&2
                      exit 1
                  fi

                  if [[ "$NATIVE_REQUIRED" != "true" && "$NATIVE_TEST_RESULT" != "skipped" ]]; then
                      echo "Native FFmpeg tests were not required but did not skip" >&2
                      exit 1
                  fi

                  echo "Native FFmpeg verification gate passed"
