name: Verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        branches: [main]

jobs:
    build:
        name: Verify
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - run: pnpm install --frozen-lockfile
            - name: Check contributor licensing
              run: pnpm run check:contributors
              env:
                  CONTRIBUTORS_BYPASS: ${{ vars.CONTRIBUTORS_BYPASS }}
                  CONTRIBUTORS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                  CONTRIBUTORS_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            - run: pnpm --filter @project/ffmpeg run verify:code
            - run: pnpm run verify:app
            - run: pnpm --filter @project/extension run zip
            - run: pnpm --filter @project/client run build
