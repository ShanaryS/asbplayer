name: Verify

on:
    push:
        branches: main
    pull_request:
        branches: main
    merge_group:
        branches: main

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]
        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: yarn
            - run: npm install --global yarn
            - run: yarn set version 3.2.0
            - run: yarn install --immutable
            - run: yarn verify:ffmpeg:code
            - run: yarn fetch:ffmpeg:runtime
            - run: yarn verify:app
            - run: yarn workspace @project/extension zip
            - run: yarn workspace @project/client build
